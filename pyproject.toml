[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-library"
version = "0.1.0"
description = "An inspectable, versioned document library for AI agents. No vector database required."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "agent-library contributors"}]
dependencies = []

[project.scripts]
agent-library = "agent_library.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
